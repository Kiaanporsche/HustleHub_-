
# HustleHub+ Frontend Nginx Configuration
# Part 3 - Docker containerisation

server {
    listen 80;
    server_name localhost;

    # Location of the React production build
    root /usr/share/nginx/html;
    index index.html;

    # Support React Router client-side navigation
    location / {
        try_files $uri $uri/ /index.html;
    }
}
